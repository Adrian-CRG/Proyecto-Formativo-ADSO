{% extends "layout.html" %}

{% block titulo %}Nuevo producto{% endblock %}

{% block contenido %}
  <h1>Registrar producto</h1>

  <form method="POST" action="{{ url_for('producto_bp.vista_crear') }}" class="form">
    <label for="codigo">Código</label>
    <input type="text" id="codigo" name="codigo" required>

    <label for="talla">Talla</label>
    <input type="text" id="talla" name="talla" required>

    <label for="color">Color</label>
    <input type="text" id="color" name="color" required>

    <label for="descripcion">Descripción</label>
    <input type="text" id="descripcion" name="descripcion" required>

    <label for="resena">Reseña</label>
    <input type="text" id="resena" name="resena">

    <label for="precio">Precio</label>
    <input type="number" id="precio" name="precio" step="0.01" min="0" required>

    <label for="calificacion">Calificación</label>
    <input type="number" id="calificacion" name="calificacion" step="0.1" min="0" max="5">

    <label for="imagen">URL de imagen</label>
    <input type="text" id="imagen" name="imagen">

    <label for="cantidad">Cantidad</label>
    <input type="number" id="cantidad" name="cantidad" min="0" required>

    <button type="submit" class="btn">Guardar</button>
  </form>
{% endblock %}
